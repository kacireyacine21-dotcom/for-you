<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Galaxy Simulation</title>
  <style>
    :root {
      --bg-1: #03020a;
      --bg-2: #15081e;
      --bg-3: #090d1f;
      --card-bg: rgba(19, 17, 31, 0.52);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f9f3ff;
      --muted: rgba(231, 219, 255, 0.8);
      --pink: #ff5ad9;
      --pink-strong: #ff1493;
      --violet: #7b39d8;
      --cyan: #7bdff2;
      --gold: #f8d88f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 20, 147, 0.22), transparent 25%),
        radial-gradient(circle at 80% 15%, rgba(138, 43, 226, 0.19), transparent 24%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        radial-gradient(circle at center, transparent 55%, rgba(4, 2, 10, 0.78) 100%),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.015),
          rgba(255,255,255,0.015) 1px,
          transparent 1px,
          transparent 4px
        );
      pointer-events: none;
      z-index: 2;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    #canvas-container canvas {
      filter: saturate(1.2) contrast(1.08) brightness(1.04);
    }

    #canvas-container::before {
      content: "";
      position: absolute;
      inset: -12%;
      background:
        radial-gradient(circle at center, rgba(255, 92, 200, 0.18), transparent 28%),
        radial-gradient(circle at 30% 70%, rgba(123, 223, 242, 0.12), transparent 25%),
        radial-gradient(circle at 55% 35%, rgba(160, 90, 255, 0.18), transparent 22%);
      filter: blur(32px);
      pointer-events: none;
      z-index: 0;
    }

    .overlay-card {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(160,129,197,0.12), rgba(47,41,72,0.2));
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px 24px 18px;
      min-width: 290px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 0 32px rgba(255, 92, 200, 0.12);
      pointer-events: auto;
    }

    .overlay-card::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 21px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 58%);
      z-index: -1;
    }

    .overlay-card h2 {
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 77, 184, 0.75);
    }

    .overlay-card h2 .spark {
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }

    .overlay-card p {
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--muted);
      max-width: 290px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(123, 223, 242, 0.1), rgba(160, 90, 255, 0.08));
      border: 1px solid rgba(123, 223, 242, 0.2);
      color: #dffcff;
      font-size: 0.72rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 18px rgba(123,223,242,0.12);
    }

    .status-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(123, 223, 242, 0.9);
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @media (max-width: 600px) {
      .overlay-card {
        top: 16px;
        right: 16px;
        left: 16px;
        min-width: auto;
      }

      .overlay-card p {
        max-width: none;
      }
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="overlay-card">
    <h2>from my future wife<span class="spark">🌌</span></h2>
    <p>Rotate the scene with your mouse and use the wheel to zoom through the star field.</p>
    <div class="status-pill"><span class="dot"></span> Live cosmos</div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05020a, 0.0024);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1200);
    camera.position.set(0, 18, 38);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x05020a, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 10;
    controls.maxDistance = 90;
    controls.rotateSpeed = 0.7;
    controls.zoomSpeed = 0.8;
    controls.enablePan = false;
    controls.minPolarAngle = 0.8;
    controls.maxPolarAngle = 1.9;
    controls.target.set(0, 2.5, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const keyLight = new THREE.PointLight(0xff5cc8, 2.2, 90, 2);
    keyLight.position.set(0, 8, 10);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x7bdff2, 1.4, 80, 2);
    rimLight.position.set(-20, -8, -18);
    scene.add(rimLight);

    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    const galaxyParams = {
      count: 26000,
      size: 0.14,
      radius: 28,
      branches: 4,
      spin: 0.9,
      randomness: 0.62,
      insideColor: '#ff4db8',
      outsideColor: '#8a2be2'
    };

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyParams.count * 3);
    const colors = new Float32Array(galaxyParams.count * 3);

    const colorInside = new THREE.Color(galaxyParams.insideColor);
    const colorOutside = new THREE.Color(galaxyParams.outsideColor);

    for (let i = 0; i < galaxyParams.count; i++) {
      const i3 = i * 3;
      const radius = Math.random() * galaxyParams.radius;
      const spinAngle = radius * galaxyParams.spin;
      const branchAngle = ((i % galaxyParams.branches) / galaxyParams.branches) * Math.PI * 2;

      const randomX = (Math.random() - 0.5) * galaxyParams.randomness * radius;
      const randomY = (Math.random() - 0.5) * galaxyParams.randomness * radius * 1.4;
      const randomZ = (Math.random() - 0.5) * galaxyParams.randomness * radius;

      const x = Math.cos(branchAngle + spinAngle) * radius + randomX;
      const y = randomY;
      const z = Math.sin(branchAngle + spinAngle) * radius + randomZ;

      positions[i3] = x;
      positions[i3 + 1] = y;
      positions[i3 + 2] = z;

      const mixedColor = colorInside.clone();
      mixedColor.lerp(colorOutside, radius / galaxyParams.radius);

      colors[i3] = mixedColor.r;
      colors[i3 + 1] = mixedColor.g;
      colors[i3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const galaxyMaterial = new THREE.PointsMaterial({
      size: galaxyParams.size,
      sizeAttenuation: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      transparent: true,
      opacity: 1
    });

    const galaxy = new THREE.Points(geometry, galaxyMaterial);
    galaxy.rotation.x = 0.8;
    galaxyGroup.add(galaxy);

    const dustGeometry = new THREE.BufferGeometry();
    const dustCount = 1500;
    const dustPositions = new Float32Array(dustCount * 3);

    for (let i = 0; i < dustCount; i++) {
      const i3 = i * 3;
      const radius = 35 + Math.random() * 90;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      dustPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
      dustPositions[i3 + 1] = radius * Math.cos(phi) * 0.6;
      dustPositions[i3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
    }

    dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));

    const dustMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.11,
      transparent: true,
      opacity: 0.7,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const dustField = new THREE.Points(dustGeometry, dustMaterial);
    scene.add(dustField);

    const nebula = new THREE.Mesh(
      new THREE.SphereGeometry(24, 32, 32),
      new THREE.MeshBasicMaterial({
        color: 0x5d2df4,
        transparent: true,
        opacity: 0.08,
        side: THREE.BackSide
      })
    );
    nebula.position.set(0, 0, 0);
    scene.add(nebula);

    const orbitRing = new THREE.Mesh(
      new THREE.TorusGeometry(16, 0.035, 16, 180),
      new THREE.MeshBasicMaterial({
        color: 0x7bdff2,
        transparent: true,
        opacity: 0.45
      })
    );
    orbitRing.rotation.x = Math.PI / 2;
    orbitRing.rotation.y = 0.8;
    scene.add(orbitRing);

    const heartShape = new THREE.Shape();
    const x = 0, y = 0;
    heartShape.moveTo(x + 0.25, y + 0.25);
    heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
    heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
    heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
    heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
    heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
    heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

    const extrudeSettings = {
      depth: 0.25,
      bevelEnabled: true,
      bevelSegments: 5,
      steps: 1,
      bevelSize: 0.08,
      bevelThickness: 0.08
    };

    const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
    heartGeo.center();

    const heartMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xff4db8,
      emissive: 0xff1d9d,
      emissiveIntensity: 1.5,
      metalness: 0.2,
      roughness: 0.25,
      clearcoat: 1,
      clearcoatRoughness: 0.2,
      transparent: true,
      opacity: 0.96,
      side: THREE.DoubleSide
    });

    const heartMesh = new THREE.Mesh(heartGeo, heartMaterial);
    heartMesh.rotation.z = Math.PI;
    heartMesh.scale.set(4.4, 4.4, 4.4);
    heartMesh.position.set(0, 4.3, 0);
    scene.add(heartMesh);

    const heartGlow = new THREE.Mesh(
      new THREE.SphereGeometry(3.5, 32, 32),
      new THREE.MeshBasicMaterial({
        color: 0xff5ad9,
        transparent: true,
        opacity: 0.2
      })
    );
    heartGlow.position.copy(heartMesh.position);
    heartGlow.scale.set(1.22, 1.18, 1.22);
    scene.add(heartGlow);

    const heartHalo = new THREE.Mesh(
      new THREE.RingGeometry(4.4, 5.8, 64),
      new THREE.MeshBasicMaterial({
        color: 0xffb3ee,
        transparent: true,
        opacity: 0.18,
        side: THREE.DoubleSide
      })
    );
    heartHalo.rotation.x = Math.PI / 2;
    heartHalo.position.set(0, 3.9, 0);
    scene.add(heartHalo);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      galaxy.rotation.y = elapsed * 0.065;
      galaxy.rotation.z = Math.sin(elapsed * 0.5) * 0.18;
      galaxyGroup.rotation.x = Math.sin(elapsed * 0.35) * 0.15;

      dustField.rotation.y = elapsed * 0.03;
      dustField.rotation.x = elapsed * 0.02;

      orbitRing.rotation.z = elapsed * 0.25;
      orbitRing.position.y = Math.sin(elapsed * 1.2) * 0.5;

      heartMesh.rotation.y = elapsed * 0.8;
      heartMesh.rotation.z = Math.PI + Math.sin(elapsed * 1.5) * 0.18;
      const pulse = 4.4 + Math.sin(elapsed * 3.2) * 0.35;
      heartMesh.scale.set(pulse, pulse, pulse);
      heartGlow.scale.setScalar(1.22 + Math.sin(elapsed * 3.6) * 0.15);
      heartGlow.material.opacity = 0.2 + Math.sin(elapsed * 3.6) * 0.05;
      heartHalo.rotation.z = elapsed * 0.45;
      heartHalo.material.opacity = 0.12 + Math.sin(elapsed * 2.8) * 0.04;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
